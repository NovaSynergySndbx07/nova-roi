const C = {
  navy:"#1C2935", navyL:"#243342", blue:"#3B9DD2", blueL:"#5BB4E4",
  gold:"#C9A84C", goldL:"#E2C06E", white:"#F8FAFC", gray:"#8B9BAD",
  danger:"#E05C5C", green:"#4CAF85",
};
const fmt = (n) => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n||0);
const pctStr = (n) => `${Number(n).toFixed(1)}%`;

/* ════════════════════════════════
   TOOLTIP
════════════════════════════════ */
function Tip({ text }) {
  const [show, setShow] = useState(false);
  return (
    <span style={{position:"relative",display:"inline-block",marginLeft:6,verticalAlign:"middle"}}>
      <span
        onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}
        onClick={()=>setShow(s=>!s)}
        style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:16,height:16,borderRadius:"50%",background:"#2E3D4E",color:C.blue,fontSize:10,fontWeight:800,cursor:"pointer",userSelect:"none",border:`1px solid ${C.blue}55`,flexShrink:0}}
      >?</span>
      {show&&(
        <div style={{position:"absolute",left:"50%",bottom:"calc(100% + 8px)",transform:"translateX(-50%)",background:"#0D1B26",border:`1px solid ${C.blue}44`,borderRadius:8,padding:"10px 13px",fontSize:11,color:C.gray,lineHeight:1.65,width:250,zIndex:300,boxShadow:"0 8px 28px rgba(0,0,0,.6)",whiteSpace:"normal"}}>
          {text}
        </div>
      )}
    </span>
  );
}

/* ════════════════════════════════
   FORMULA COLLAPSIBLE
════════════════════════════════ */
function FormulaBox({ formula, vars, color }) {
  const [open, setOpen] = useState(false);
  const col = color||C.blue;
  return (
    <div style={{background:"#111E28",border:`1px solid ${col}30`,borderRadius:10,marginBottom:22,overflow:"hidden"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 16px",cursor:"pointer"}}>
        <span style={{fontSize:11,fontWeight:700,color:col,letterSpacing:".07em"}}>📐 VER FÓRMULA Y GLOSARIO DE VARIABLES</span>
        <span style={{color:col,transition:"transform .2s",display:"inline-block",transform:open?"rotate(180deg)":"rotate(0deg)",fontSize:14}}>▾</span>
      </div>
      {open&&(
        <div style={{padding:"4px 16px 16px",borderTop:`1px solid ${col}20`}}>
          <div style={{background:"#0D1B26",borderRadius:8,padding:"12px 16px",marginBottom:14,fontFamily:"monospace",fontSize:12,color:C.goldL,lineHeight:1.9}}>
            {formula.map((line,i)=><div key={i}>{line||<br/>}</div>)}
          </div>
          <div style={{fontSize:11,fontWeight:700,color:C.gray,letterSpacing:".07em",marginBottom:10}}>GLOSARIO DE VARIABLES</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {vars.map((v,i)=>(
              <div key={i} style={{display:"flex",gap:10,fontSize:11,lineHeight:1.6}}>
                <span style={{color:C.gold,fontWeight:700,minWidth:110,fontFamily:"monospace",flexShrink:0}}>{v.name}</span>
                <span style={{color:C.gray}}>{v.def}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════
   WATERFALL CHART
════════════════════════════════ */
function Waterfall({ items, modColor }) {
  const maxAbs = Math.max(...items.filter(i=>!i.note&&i.v!==0).map(i=>Math.abs(i.v)),1);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {items.map((d,i)=>{
        if(d.note) return (
          <div key={i} style={{fontSize:11,color:C.gray,fontStyle:"italic",padding:"7px 12px",background:"#1A2634",borderRadius:7}}>ℹ️ {d.c}</div>
        );
        const isNeg=d.v<0;
        const barW=Math.min(100,Math.abs(d.v)/maxAbs*100);
        return (
          <div key={i} style={{background:d.hi?`${modColor}16`:"transparent",border:`1px solid ${d.hi?modColor+"30":"transparent"}`,borderRadius:8,padding:"10px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:d.v!==0?6:0}}>
              <div style={{fontSize:12,color:d.hi?C.white:C.gray,fontWeight:d.hi?600:400,flex:1,paddingRight:12,lineHeight:1.5}}>{d.c}</div>
              {d.v!==0&&<div style={{fontSize:13,fontWeight:800,color:isNeg?C.danger:(d.hi?C.gold:C.blueL),whiteSpace:"nowrap"}}>{isNeg?"":"+"}{fmt(d.v)}</div>}
            </div>
            {d.v!==0&&(
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,height:5,background:"#1A2634",borderRadius:3,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${barW}%`,background:isNeg?C.danger:(d.hi?C.gold:C.blue),borderRadius:3,transition:"width .7s ease"}}/>
                </div>
                <div style={{fontSize:9,color:isNeg?C.danger:(d.hi?C.gold:C.blueL),fontWeight:700,minWidth:36,textAlign:"right"}}>{barW.toFixed(0)}%</div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════
   ADVANCED MODE TOGGLE
════════════════════════════════ */
function AdvancedToggle({ on, onToggle, color }) {
  return (
    <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:on?`${color}18`:"#1A2634",border:`1px solid ${on?color+"44":"#2E3D4E"}`,borderRadius:8,cursor:"pointer",marginBottom:20,transition:"all .2s",userSelect:"none"}}>
      <div style={{width:36,height:20,background:on?color:"#2E3D4E",borderRadius:10,position:"relative",transition:"background .2s",flexShrink:0}}>
        <div style={{position:"absolute",top:3,left:on?17:3,width:14,height:14,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 4px rgba(0,0,0,.4)"}}/>
      </div>
      <div>
        <div style={{fontSize:12,fontWeight:700,color:on?color:C.gray}}>Modo Avanzado {on?"activado":"desactivado"}</div>
        <div style={{fontSize:10,color:C.gray,marginTop:1}}>{on?"Variables adicionales para análisis más detallado":"Activa para incluir más variables y mayor precisión"}</div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   MÓDULOS
════════════════════════════════════════════════════ */
const MODULES = [

/* ───────────────────────────────────────
   1. CIBERSEGURIDAD  ← Modo avanzado
─────────────────────────────────────── */
{
  id:"cyber", label:"Ciberseguridad", icon:"🛡️",
  subtitle:"Cumplimiento · Pentesting · Monitoreo Dark Web",
  color:"#E05C5C", hasAdvanced:true,
  description:"Cuantifica el riesgo financiero total de no proteger tu organización: incidentes, multas, downtime y daño reputacional.",
  formula:[
    "── MODO BÁSICO ──────────────────────────",
    "REA = (Costo Incidente + Ingresos×8%) × P_incidente",
    "Beneficio Neto = REA − Inversión Anual",
    "ROI = (Beneficio Neto / Inversión Anual) × 100",
    "",
    "── MODO AVANZADO ────────────────────────",
    "REA = (Costo Incidente × P_inc)",
    "    + (Horas Downtime × Costo/hora × P_inc)",
    "    + (Ingresos × 3% × P_multa)",
    "    + (Ingresos × 5% × P_reputación)",
    "    + (Costo Cumplimiento × P_inc)",
    "    + (Costo Forense × P_inc)",
    "Beneficio Neto = REA − Inversión Anual",
    "ROI = (Beneficio Neto / Inversión Anual) × 100",
  ],
  formulaVars:[
    {name:"REA",def:"Riesgo Esperado Anual: pérdida financiera ponderada por la probabilidad de que ocurra un incidente."},
    {name:"P_incidente",def:"Probabilidad de sufrir un incidente sin protección: Alta=65%, Media=45%, Baja=20%."},
    {name:"Costo Incidente",def:"Respuesta de emergencia + recuperación de datos + notificaciones legales obligatorias. Promedio LATAM PyME: $200k–$500k MXN."},
    {name:"Horas Downtime",def:"(Avanzado) Horas que la operación se detiene. Ransomware: 72–240h. DDoS: 4–24h. Phishing interno: 8–48h."},
    {name:"Costo/hora op.",def:"(Avanzado) Pérdida por hora de inactividad = (Nómina mensual ÷ 160) + ventas/hora + penalizaciones a clientes."},
    {name:"P_multa",def:"(Avanzado) Probabilidad de multa regulatoria (LFPDPPP, PCI-DSS, NOM-151). Se aplica al 3% del ingreso anual."},
    {name:"P_reputación",def:"(Avanzado) Probabilidad de perder clientes o contratos por daño reputacional. Se aplica al 5% del ingreso anual."},
    {name:"Costo Cumplimiento",def:"(Avanzado) Costo de remediar incumplimientos regulatorios descubiertos tras un incidente: auditorías, consultores, certificaciones."},
    {name:"Costo Forense",def:"(Avanzado) Honorarios de empresa especializada en análisis forense digital para determinar causa y alcance del incidente."},
  ],
  fields:[
    {key:"ingresoAnual",label:"Ingreso anual de la empresa",suffix:"MXN/año",placeholder:"10000000",tip:"Facturación total anual. Se usa para dimensionar el impacto proporcional de multas y daño reputacional."},
    {key:"empleados",label:"Número de empleados",suffix:"personas",placeholder:"80",tip:"Define la superficie de ataque (endpoints, cuentas) y el costo de remedición por persona afectada."},
    {key:"probabilidad",label:"Probabilidad de incidente sin protección actual",type:"select",options:["Alta (>60%) — sin controles básicos","Media (30–60%) — controles parciales","Baja (<30%) — controles básicos existentes"],tip:"Sin firewall actualizado, sin backup automático ni capacitación anti-phishing → Alta. Con algunos controles pero sin monitoreo activo → Media."},
    {key:"costoIncidente",label:"Costo estimado de un incidente mayor",suffix:"MXN",placeholder:"350000",tip:"Respuesta forense ($50–150k) + recuperación de datos ($50–200k) + notificaciones legales ($30–80k) + tiempo del equipo. PyME LATAM promedio: $200k–$500k MXN."},
    {key:"costoInversion",label:"Inversión mensual en ciberseguridad",suffix:"MXN/mes",placeholder:"35000",tip:"Pentesting trimestral + monitoreo 24/7 + gestión de vulnerabilidades + monitoreo dark web + cumplimiento. Referencia: $20k–$80k/mes según tamaño."},
  ],
  fieldsAdvanced:[
    {key:"horasDowntime",label:"Horas de inactividad estimadas en un incidente",suffix:"horas",placeholder:"72",tip:"Ransomware detiene operaciones 3–10 días (72–240h). DDoS: 4–24h. Considera tu peor escenario realista."},
    {key:"costoHoraOp",label:"Costo operativo por hora de inactividad",suffix:"MXN/hora",placeholder:"8000",tip:"Cálculo rápido: (Nómina mensual total ÷ 160h) + ventas promedio/hora + penalizaciones a clientes. Para $1M/mes ingresos → ~$6,000–$12,000 MXN/hora."},
    {key:"costoMultaDirecta",label:"Multa regulatoria estimada máxima aplicable",suffix:"MXN",placeholder:"500000",tip:"LFPDPPP: hasta 320,000 días de salario mínimo (~$30M MXN). PCI-DSS: $5k–$100k USD. Estima según tu industria y tamaño. Si no sabes, usa el 3% de tu ingreso anual."},
    {key:"costoForense",label:"Costo de análisis forense digital",suffix:"MXN",placeholder:"120000",tip:"Empresa especializada para determinar causa, alcance y evidencias del incidente. Honorarios en México: $80k–$250k MXN según complejidad."},
    {key:"costoCumplimiento",label:"Costo de remediar incumplimientos regulatorios",suffix:"MXN",placeholder:"200000",tip:"Auditorías post-incidente + consultores de compliance + certificaciones requeridas (ISO 27001, PCI). Estima $100k–$400k MXN para empresas medianas."},
  ],
  calcROI:(v,advanced)=>{
    const prob = v.probabilidad.startsWith("Alta")?0.65:v.probabilidad.startsWith("Media")?0.45:0.20;
    const invAnual = v.costoInversion*12;
    let desglose=[], rea=0;

    if(!advanced){
      const riesgoBase = (v.costoIncidente + v.ingresoAnual*0.08)*prob;
      rea = riesgoBase;
      desglose=[
        {c:`Costo de incidente mayor ponderado (×${pctStr(prob*100)})`,v:v.costoIncidente*prob},
        {c:`Pérdida operativa estimada (8% ingresos × ${pctStr(prob*100)})`,v:v.ingresoAnual*0.08*prob,hi:true},
        {c:"Riesgo Esperado Anual (REA) mitigado",v:rea,hi:true},
        {c:"Inversión anual en ciberseguridad",v:-invAnual},
        {c:"Beneficio neto anual",v:rea-invAnual,hi:true},
      ];
    } else {
      const pMulta=prob*0.6, pRep=prob*0.7;
      const rInc   = v.costoIncidente*prob;
      const rDT    = (v.horasDowntime||0)*(v.costoHoraOp||0)*prob;
      const rMulta = (v.costoMultaDirecta||0)*pMulta;
      const rRep   = v.ingresoAnual*0.05*pRep;
      const rFor   = (v.costoForense||0)*prob;
      const rCump  = (v.costoCumplimiento||0)*prob;
      rea = rInc+rDT+rMulta+rRep+rFor+rCump;
      desglose=[
        {c:`Costo directo del incidente (×${pctStr(prob*100)})`,v:rInc},
        {c:`Downtime operativo: ${v.horasDowntime||0}h × ${fmt(v.costoHoraOp||0)}/h × ${pctStr(prob*100)}`,v:rDT},
        {c:`Multa regulatoria esperada (LFPDPPP/PCI-DSS × ${pctStr(pMulta*100)})`,v:rMulta},
        {c:`Daño reputacional (5% ingresos × ${pctStr(pRep*100)})`,v:rRep,hi:true},
        {c:`Análisis forense digital (×${pctStr(prob*100)})`,v:rFor},
        {c:`Remediación de cumplimiento regulatorio (×${pctStr(prob*100)})`,v:rCump},
        {c:"Riesgo Esperado Anual TOTAL (REA) mitigado",v:rea,hi:true},
        {c:"Inversión anual en ciberseguridad",v:-invAnual},
        {c:"Beneficio neto anual",v:rea-invAnual,hi:true},
      ];
    }
    const beneficio=rea-invAnual;
    return {
      roi:((beneficio/invAnual)*100).toFixed(0), beneficio, mensual:beneficio/12,
      formulaAplicada: advanced?[
        `REA = ${fmt(v.costoIncidente)}×${pctStr(prob*100)} + Downtime + Multa + Reputación + Forense + Cumplimiento`,
        `REA = ${fmt(rea)}`,
        `Beneficio = ${fmt(rea)} − ${fmt(invAnual)} = ${fmt(beneficio)}`,
        `ROI = ${fmt(beneficio)} / ${fmt(invAnual)} × 100 = ${((beneficio/invAnual)*100).toFixed(0)}%`,
      ]:[
        `REA = (${fmt(v.costoIncidente)} + ${fmt(v.ingresoAnual)}×8%) × ${pctStr(prob*100)}`,
        `REA = ${fmt(rea)}`,
        `Beneficio = ${fmt(rea)} − ${fmt(invAnual)} = ${fmt(beneficio)}`,
        `ROI = ${fmt(beneficio)} / ${fmt(invAnual)} × 100 = ${((beneficio/invAnual)*100).toFixed(0)}%`,
      ],
      desglose,
    };
  },
},

/* ───────────────────────────────────────
   2. ONBOARDING DIGITAL
─────────────────────────────────────── */
{
  id:"onboarding", label:"Onboarding Digital", icon:"🚀",
  subtitle:"Verificación · KYC · Incorporación automatizada",
  color:"#3B9DD2", hasAdvanced:false,
  description:"Mide el ahorro operativo y los ingresos recuperados al reducir tiempos y abandono en el proceso de incorporación.",
  formula:[
    "Ahorro Operativo = (Días × 8h × 70%) × Costo/hora × Onboardings/mes × 12",
    "Ingresos Recup. = Onboardings/mes × Abandono% × 60% × Valor/persona × 12",
    "Beneficio Neto = Ahorro Operativo + Ingresos Recuperados − Inversión Anual",
    "ROI = (Beneficio Neto / Inversión Anual) × 100",
  ],
  formulaVars:[
    {name:"70% automatiz.",def:"Benchmark: el 70% de tareas manuales (formularios, verificación, firma) se automatizan con plataforma digital."},
    {name:"60% recuperac.",def:"De quienes abandonaban el proceso, el 60% lo completan con un flujo digital optimizado (menos fricción)."},
    {name:"Valor/persona",def:"CLIENTES: ticket promedio × frecuencia anual. EMPLEADOS: productividad primer año o costo de reposición de plaza vacante ($30k–$80k típico en México)."},
  ],
  fields:[
    {key:"onboardingMensual",label:"Nuevos onboardings por mes",suffix:"personas/mes",placeholder:"60",tip:"Suma clientes nuevos + empleados nuevos si ambos usan el mismo proceso."},
    {key:"tiempoActual",label:"Duración actual del proceso de onboarding",suffix:"días hábiles",placeholder:"4",tip:"Desde solicitud hasta aprobación/activación. Incluye tiempos de espera entre pasos, no solo trabajo activo."},
    {key:"costoHoraRRHH",label:"Costo hora del equipo que gestiona el proceso",suffix:"MXN/hora",placeholder:"220",tip:"Fórmula rápida: salario bruto mensual ÷ 160 horas. Si el equipo gana $35,000/mes bruto → $219/hora."},
    {key:"abandonoActual",label:"Tasa de abandono actual en el proceso",suffix:"%",placeholder:"22",tip:"% de prospectos/candidatos que NO completan el proceso. Proceso digital deficiente: 20–35%. Con plataforma óptima: 5–10%."},
    {key:"valorPersonaAnual",label:"Valor anual por persona incorporada",suffix:"MXN/año",placeholder:"18000",tip:"CLIENTES: ticket promedio × compras/año (ej. $1,500 × 12 = $18,000). EMPLEADOS: costo de reposición si la plaza queda vacante."},
    {key:"costoInversion",label:"Inversión mensual en plataforma de onboarding",suffix:"MXN/mes",placeholder:"12000",tip:"Licencia + integraciones + soporte. Referencia: Truora, IDenfy, Jumio → $8k–$25k MXN/mes según volumen."},
  ],
  calcROI:(v)=>{
    const hAh=v.tiempoActual*8*0.70;
    const ahorroOp=hAh*v.costoHoraRRHH*v.onboardingMensual*12;
    const recup=Math.round(v.onboardingMensual*(v.abandonoActual/100)*0.60*12);
    const ingresos=recup*v.valorPersonaAnual;
    const inv=v.costoInversion*12;
    const beneficio=ahorroOp+ingresos-inv;
    return {
      roi:((beneficio/inv)*100).toFixed(0),beneficio,mensual:beneficio/12,
      formulaAplicada:[
        `Horas ahorradas/persona = ${v.tiempoActual}d × 8h × 70% = ${hAh.toFixed(1)}h`,
        `Ahorro Op. = ${hAh.toFixed(1)}h × ${fmt(v.costoHoraRRHH)}/h × ${v.onboardingMensual} × 12 = ${fmt(ahorroOp)}`,
        `Recuperados = ${v.onboardingMensual} × ${v.abandonoActual}% × 60% × 12 = ${recup} personas`,
        `Ing. Recup. = ${recup} × ${fmt(v.valorPersonaAnual)} = ${fmt(ingresos)}`,
        `ROI = ${fmt(beneficio)} / ${fmt(inv)} × 100 = ${((beneficio/inv)*100).toFixed(0)}%`,
      ],
      desglose:[
        {c:`Horas ahorradas: ${hAh.toFixed(1)}h/persona × ${v.onboardingMensual} personas/mes × 12 meses`,v:0,note:true},
        {c:"Ahorro operativo por automatización del proceso",v:ahorroOp},
        {c:`Ingresos recuperados por reducir abandono (${recup} personas/año)`,v:ingresos,hi:true},
        {c:"Inversión anual en plataforma",v:-inv},
        {c:"Beneficio neto anual",v:beneficio,hi:true},
      ],
    };
  },
},

    {key:"rotacionActual",label:"Tasa de rotación anual actual",suffix:"%",placeholder:"22",tip:"Fórmula: (Bajas en el año ÷ Promedio de empleados) × 100. Puedes pedírsela directamente a RRHH."},
    {key:"salarioPromedio",label:"Salario mensual bruto promedio",suffix:"MXN/mes",placeholder:"18000",tip:"Salario bruto antes de deducciones. Usa el promedio del nivel operativo-medio que más rota."},
    {key:"costoReclutamiento",label:"Costo de reclutamiento por nueva contratación",suffix:"MXN/plaza",placeholder:"45000",tip:"Publicaciones ($3–8k) + tiempo RRHH + agencia headhunter ($18–40k si aplica) + exámenes ($2–5k). Total típico: $25k–$80k MXN."},
    {key:"costoInversion",label:"Inversión mensual en plataforma RH",suffix:"MXN/mes",placeholder:"9000",tip:"Licencia de plataforma (Buk, Factorial, etc.) + implementación prorrateada. Referencia: $5k–$20k/mes según número de empleados."},
  ],
  fieldsAdvanced:[
    {key:"costoCapacitacion",label:"Costo de capacitación e inducción por nuevo empleado",suffix:"MXN/persona",placeholder:"12000",tip:"Cursos + materiales + tiempo de tutor interno. Un onboarding de 2 semanas con mentor a $20k/mes ≈ $10k solo en tiempo."},
    {key:"diasAusentismo",label:"Días promedio de ausentismo adicional por empleado sin engagement",suffix:"días/año",placeholder:"6",tip:"Benchmark Gallup: empleados no comprometidos tienen 6 días más de faltas/año vs. comprometidos. Ajusta si tienes tu propio dato."},
    {key:"bonusProductividad",label:"Incremento de productividad en empleados retenidos y comprometidos",suffix:"%",placeholder:"15",tip:"Gallup reporta 21% más productividad en equipos comprometidos. Usa 10–21% según tu industria. Se aplica sobre la nómina mensual de los empleados retenidos."},
  ],
  calcROI:(v,advanced)=>{
    const rotaAnual=Math.round(v.empleados*(v.rotacionActual/100));
    const evitados=Math.round(rotaAnual*0.35);
    const ahorroDirec=evitados*v.costoReclutamiento;
    const ahorroProd=evitados*v.salarioPromedio*2;
    const inv=v.costoInversion*12;
    let beneficio, desglose;
    if(!advanced){
      beneficio=ahorroDirec+ahorroProd-inv;
      desglose=[
        {c:`Empleados que rotan: ${rotaAnual}/año → Evitados con plataforma (35%): ${evitados}`,v:0,note:true},
        {c:"Ahorro en reclutamiento por plaza cubierta",v:ahorroDirec},
        {c:"Ahorro en productividad recuperada (2 meses/plaza)",v:ahorroProd,hi:true},
        {c:"Inversión anual en plataforma RH",v:-inv},
        {c:"Beneficio neto anual",v:beneficio,hi:true},
      ];
    } else {
      const ahorroCap=evitados*(v.costoCapacitacion||0);
      const salarioDia=v.salarioPromedio/22;
      const ahorroAus=v.empleados*(v.diasAusentismo||6)*salarioDia;
      const ahorroEngag=(v.empleados*0.35)*v.salarioPromedio*12*((v.bonusProductividad||15)/100);
      beneficio=ahorroDirec+ahorroProd+ahorroCap+ahorroAus+ahorroEngag-inv;
      desglose=[
        {c:`Empleados que rotan: ${rotaAnual}/año → Evitados con plataforma: ${evitados}`,v:0,note:true},
        {c:"Ahorro en reclutamiento",v:ahorroDirec},
        {c:"Ahorro en productividad (2 meses de rampa por plaza)",v:ahorroProd},
        {c:"Ahorro en capacitación e inducción",v:ahorroCap},
        {c:`Reducción de ausentismo (${v.diasAusentismo||6} días/empleado/año)`,v:ahorroAus,hi:true},
        {c:`Ganancia por mayor compromiso (+${v.bonusProductividad||15}% productividad en ${Math.round(v.empleados*0.35)} empleados)`,v:ahorroEngag,hi:true},
        {c:"Inversión anual en plataforma RH",v:-inv},
        {c:"Beneficio neto anual",v:beneficio,hi:true},
      ];
    }
    return {
      roi:((beneficio/inv)*100).toFixed(0),beneficio,mensual:beneficio/12,
      formulaAplicada:[
        `Rotación actual: ${rotaAnual} personas/año × 35% = ${evitados} plazas evitadas`,
        `Ahorro reclutamiento = ${evitados} × ${fmt(v.costoReclutamiento)} = ${fmt(ahorroDirec)}`,
        `Ahorro productividad = ${evitados} × ${fmt(v.salarioPromedio)} × 2 = ${fmt(ahorroProd)}`,
        `ROI = ${fmt(beneficio)} / ${fmt(inv)} × 100 = ${((beneficio/inv)*100).toFixed(0)}%`,
      ],
      desglose,
    };
  },
},

    const ganCalidad=ahorroOp*0.30;
    const inv=v.costoInversion*12;
    let beneficio, desglose;
    if(!advanced){
      beneficio=ahorroOp+ganCalidad-inv;
      desglose=[
        {c:`Horas automatizadas: ${horasAhorro.toFixed(0)} hrs/año (${v.empleados} personas × ${(mult*100).toFixed(0)}% de ${v.horasSemana}h/sem)`,v:0,note:true},
        {c:"Ahorro operativo por reducción de tiempo en tareas repetitivas",v:ahorroOp},
        {c:"Ganancia adicional por mayor calidad y velocidad (+30%)",v:ganCalidad,hi:true},
        {c:"Inversión anual en implementación y licencias IA",v:-inv},
        {c:"Beneficio neto anual",v:beneficio,hi:true},
      ];
    } else {
      const ahorroErr=ahorroOp*((v.pctErrores||20)/100)*0.5;
      const valTTM=(v.proyectosAno||8)*(v.diasAceleracion||5)*(v.costoDiaProyecto||15000);
      beneficio=ahorroOp+ganCalidad+ahorroErr+valTTM-inv;
      desglose=[
        {c:`Horas automatizadas: ${horasAhorro.toFixed(0)} hrs/año`,v:0,note:true},
        {c:"Ahorro operativo por automatización de tareas",v:ahorroOp},
        {c:"Ganancia por mayor calidad y velocidad (+30%)",v:ganCalidad},
        {c:`Ahorro por reducción de errores y retrabajo (${v.pctErrores||20}% reducción × 50%)`,v:ahorroErr,hi:true},
        {c:`Aceleración time-to-market: ${v.proyectosAno||8} proyectos × ${v.diasAceleracion||5} días × ${fmt(v.costoDiaProyecto||15000)}/día`,v:valTTM,hi:true},
        {c:"Inversión anual en implementación y licencias IA",v:-inv},
        {c:"Beneficio neto anual",v:beneficio,hi:true},
      ];
    }
    return {
      roi:((beneficio/inv)*100).toFixed(0),beneficio,mensual:beneficio/12,
      formulaAplicada:[
        `Horas automatz. = ${v.empleados} × ${v.horasSemana}h × ${(mult*100).toFixed(0)}% × 52 = ${horasAhorro.toFixed(0)}h/año`,
        `Ahorro Op. = ${horasAhorro.toFixed(0)}h × ${fmt(v.costoHora)}/h = ${fmt(ahorroOp)}`,
        `Ganancia calidad = ${fmt(ahorroOp)} × 30% = ${fmt(ganCalidad)}`,
        `ROI = ${fmt(beneficio)} / ${fmt(inv)} × 100 = ${((beneficio/inv)*100).toFixed(0)}%`,
      ],
      desglose,
    };
  },
},

];/* end MODULES */

                <div style={{fontSize:30,marginBottom:10}}>📋</div>
                <h2 style={{fontSize:18,fontWeight:800,marginBottom:6}}>Recibe tu diagnóstico completo</h2>
                <div style={{fontSize:12,color:C.gray,lineHeight:1.7}}>Un consultor de Nova Synergy te contactará en menos de 24 hrs con recomendaciones personalizadas para tu empresa.</div>
              </div>
              <div style={{padding:28,display:"flex",flexDirection:"column",gap:18}}>
                {[{key:"nombre",label:"Nombre completo",placeholder:"Tu nombre",type:"text"},{key:"email",label:"Correo electrónico",placeholder:"tu@empresa.com",type:"email"},{key:"whatsapp",label:"WhatsApp / Teléfono",placeholder:"+52 55 0000 0000",type:"tel"},{key:"empresa",label:"Empresa",placeholder:"Nombre de tu empresa",type:"text"}].map((f,i)=>(
                  <div key={f.key} className="fu" style={{animationDelay:`${i*.07}s`}}>
                    <label style={{fontSize:12,fontWeight:700,display:"block",marginBottom:7}}>{f.label}</label>
                    <input className="inp" type={f.type} placeholder={f.placeholder} value={lead[f.key]} onChange={e=>{setLead(p=>({...p,[f.key]:e.target.value}));setErrs(p=>({...p,[f.key]:null}));}}/>
                    {errs[f.key]&&<div style={{fontSize:11,color:C.danger,marginTop:5}}>⚠ {errs[f.key]}</div>}
                  </div>
                ))}
                <div style={{fontSize:10,color:C.gray,lineHeight:1.6}}>🔒 Tu información es privada. No compartimos tus datos con terceros.</div>
                <button className="btn" onClick={send} style={{background:`linear-gradient(135deg,${C.gold},${C.goldL})`,color:C.navy,padding:"15px",fontSize:14,borderRadius:10}}>Enviar y recibir mi diagnóstico →</button>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:11,color:C.gray,marginBottom:10}}>O si prefieres agendar directamente:</div>
                  <a href={CAL} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}>
                    <button className="btn" style={{background:"transparent",border:`1.5px solid ${C.blue}`,color:C.blue,padding:"11px 22px",fontSize:12}}>📅 Agendar con Nova Synergy & Tech Partners</button>
                  </a>
                </div>
              </div>
            </div>
          ):(
            <div className="fu" style={{background:C.navyL,border:"1.5px solid #C9A84C44",borderRadius:20,padding:"50px 28px",textAlign:"center"}}>
              <div style={{fontSize:52,marginBottom:18}}>🎉</div>
              <h2 style={{fontSize:22,fontWeight:900,marginBottom:10}}>¡Listo, {lead.nombre.split(" ")[0]}!</h2>
              <div style={{fontSize:14,color:C.gray,lineHeight:1.8,marginBottom:28}}>
                Recibimos tu solicitud. Un consultor de Nova Synergy te contactará en las próximas <strong style={{color:C.white}}>24 horas</strong> con tu diagnóstico personalizado.
              </div>
              <div style={{background:"#C9A84C14",border:"1px solid #C9A84C30",borderRadius:12,padding:22,marginBottom:24}}>
                <div style={{fontSize:11,color:C.gold,fontWeight:700,marginBottom:6}}>¿NO QUIERES ESPERAR?</div>
                <div style={{fontSize:12,color:C.gray,marginBottom:14}}>Agenda ahora tu sesión estratégica gratuita de 30 min</div>
                <a href={CAL} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}>
                  <button className="btn" style={{background:`linear-gradient(135deg,${C.gold},${C.goldL})`,color:C.navy,padding:"12px 26px",fontSize:13}}>📅 Agendar mi sesión ahora</button>
                </a>
              </div>
              <button className="btn" onClick={()=>{setSent(false);setLead({nombre:"",email:"",whatsapp:"",empresa:""});go("home");}} style={{background:"transparent",color:C.gray,padding:"9px 18px",fontSize:12}}>← Evaluar otra área</button>
            </div>
          )}
        </div>
      )}

      {/* FOOTER */}
      <footer style={{borderTop:"1px solid #2A3A4A",padding:"22px 20px",marginTop:40}}>
        <div style={{maxWidth:960,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
          <div style={{fontSize:11,color:C.gray}}>© 2025 Nova Synergy & Tech Partners · <span style={{color:C.gold}}>roi.novasynergy.tech</span></div>
          <div style={{fontSize:10,color:"#8B9BAD77",fontStyle:"italic"}}>Proyecciones orientativas basadas en benchmarks LATAM. Resultados reales pueden variar.</div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
